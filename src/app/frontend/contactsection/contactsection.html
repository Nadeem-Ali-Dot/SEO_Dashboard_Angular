<section
    id="contact"
    class="bg-gray-900 px-6 py-16 text-white">

    <div class="mx-auto max-w-7xl">

      <!-- Header -->
      <div class="text-center">

        <p class="text-sm font-semibold uppercase tracking-wider text-blue-400">
          Contact
        </p>

        <h2 class="mt-2 text-3xl font-bold">
          Get In Touch
        </h2>

        <p class="mt-3 text-gray-400">
          Have questions? We'd love to hear from you
        </p>

      </div>


      <!-- Contact Cards -->
      <div class="mt-10 grid grid-cols-1 gap-6 md:grid-cols-3">

        <!-- Phone -->
        <div class="rounded-xl bg-gray-800 p-6 text-center">

          <div
            class="mx-auto flex h-12 w-12 items-center justify-center
                   rounded-full bg-blue-600">

            📞

          </div>

          <h3 class="mt-4 font-semibold">
            Phone
          </h3>

          <p class="mt-2 text-gray-400">
           {{contact()?.phoneNumber}}
          </p>

        </div>


        <!-- Email -->
        <div class="rounded-xl bg-gray-800 p-6 text-center">

          <div
            class="mx-auto flex h-12 w-12 items-center justify-center
                   rounded-full bg-blue-600">

            ✉️

          </div>

          <h3 class="mt-4 font-semibold">
            Email
          </h3>

          <p class="mt-2 text-gray-400">
              {{contact()?.email}}
          </p>

        </div>


        <!-- Address -->
        <div class="rounded-xl bg-gray-800 p-6 text-center">

          <div
            class="mx-auto flex h-12 w-12 items-center justify-center
                   rounded-full bg-blue-600">

            📍

          </div>

          <h3 class="mt-4 font-semibold">
            Address
          </h3>

          <p class="mt-2 text-sm leading-6 text-gray-400">
              {{contact()?.officeAddress}}
          </p>

        </div>


      </div>
      @if (contact()?.googleMapEmbedCode) {

            <div class="overflow-hidden rounded-xl border mt-3">

              <div
                [innerHTML]="mapHtml"
                class="h-64 w-full"
              ></div>

            </div>

          }

    </div>

  </section>

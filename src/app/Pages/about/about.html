<div class="min-h-full bg-slate-50 p-6">
 <form [formGroup]="AboutsectionForm" (ngSubmit)="onSubmit()" >
  <!-- Page Header -->
  <div class="mb-6">
    <h1 class="text-3xl font-bold text-slate-900">
      About Us
    </h1>

    <p class="mt-1 text-slate-500">
      Manage your about section
    </p>
  </div>


  <!-- Main Grid -->
  <div class="grid grid-cols-1 xl:grid-cols-1 gap-6">

    <!-- ================= FORM ================= -->
    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm">

      <!-- Card Header -->
      <div class="px-6 py-5 border-b border-slate-200 flex items-center gap-3">

        <div
          class="w-11 h-11 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-xl"
        >
          ℹ
        </div>

        <div>
          <h2 class="text-lg font-bold text-slate-900">
            About Section
          </h2>

          <p class="text-sm text-slate-500">
            Update your company information
          </p>
        </div>

      </div>


      <!-- Form -->
      <div class="p-6 space-y-6">

        <!-- Section Title -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">
            Section Title
          </label>

          <input
            type="text"
          formControlName="title"
            placeholder="Enter section title"
            class="w-full h-12 px-4 rounded-xl border border-slate-300
                   text-slate-800 placeholder:text-slate-400
                   outline-none transition
                   focus:border-blue-500 focus:ring-4 focus:ring-blue-100"
          />
        </div>


        <!-- Description -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">
            Description
          </label>

          <textarea
            
            rows="8"
            placeholder="Enter about section description"
            formControlName="description"
            class="w-full px-4 py-3 rounded-xl border border-slate-300
                   text-slate-800 placeholder:text-slate-400
                   outline-none resize-none transition
                   focus:border-blue-500 focus:ring-4 focus:ring-blue-100"
          ></textarea>

          <p class="mt-2 text-xs text-slate-400">
            Write a clear description about your company and services.
          </p>
        </div>


        <!-- Featured Image -->
        <div>

          <label class="block text-sm font-semibold text-slate-700 mb-2">
            Featured Image
          </label>


          <!-- Upload Box -->
          <div
            class="border-2 border-dashed border-slate-300
                   rounded-2xl p-5
                   hover:border-blue-400 hover:bg-blue-50/30
                   transition"
          >

            <!-- Preview -->
            <!-- @if (about.featuredImage) { -->

              <div class="relative">

                <img  [src]="imagePreview"
                  alt="About Featured Image"
                  class="w-full h-56 object-cover rounded-xl border border-slate-200"
                />

                <!-- Remove -->
                <button
                 
                 
                  class="absolute top-3 right-3
                         w-9 h-9 rounded-full
                         bg-white text-red-500
                         shadow-md
                         hover:bg-red-50
                         flex items-center justify-center"
                >
                  ×
                </button>

              </div>

            <!-- } -->


            <!-- Upload -->
            <div class="mt-4">

              <label
                class="w-full h-12 px-4
                       rounded-xl
                       bg-slate-100
                       hover:bg-blue-50
                       text-slate-700
                       hover:text-blue-600
                       font-semibold
                       flex items-center justify-center
                       cursor-pointer
                       transition"
              >

                <span>
                  📤 Upload Featured Image
                </span>

                <input (change)="onFileSelected($event)"
                  type="file"
                  accept=".png,.jpg,.jpeg,.gif,.webp"
                  class="hidden"
                  
                />

              </label>

            </div>


            <p class="text-center text-xs text-slate-400 mt-3">
              PNG, JPG, GIF, WEBP up to 5MB
            </p>

          </div>

        </div>


        <!-- Buttons -->
        <div class="pt-2 flex items-center justify-end gap-3">

        


         <button
  type="submit"
  [disabled]="isloading()"
  class="px-7 py-3 rounded-xl
         bg-blue-600 text-white
         font-semibold
         shadow-lg shadow-blue-200
         hover:bg-blue-700
         transition
         disabled:opacity-70
         disabled:cursor-not-allowed">

  @if (isloading()) {

    <span class="inline-flex items-center gap-2">

      <span
        class="h-5 w-5
               animate-spin
               rounded-full
               border-2
               border-white/40
               border-t-white">
      </span>

      Saving...

    </span>

  } @else {

    Save Changes

  }

</button>

        </div>

      </div>

    </div>



    <!-- ================= LIVE PREVIEW ================= -->
  

  </div>
</form>
</div>

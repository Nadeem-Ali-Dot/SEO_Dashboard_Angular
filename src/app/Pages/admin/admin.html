<div class="min-h-screen bg-slate-50">

  <!-- ========================================= -->
  <!-- SIDEBAR -->
  <!-- ========================================= -->

  <aside
    class="fixed left-0 top-0 z-50 h-screen bg-white border-r border-slate-200
           transition-all duration-300 flex flex-col"
    [class.w-[280px]]="sidebarOpen"
    [class.w-[80px]]="!sidebarOpen"
  >

    <!-- LOGO -->
    <div
      class="h-[95px] flex items-center px-5 border-b border-slate-200 shrink-0"
    >

      <div
        class="w-11 h-11 rounded-xl
               bg-gradient-to-br from-blue-600 to-indigo-600
               text-white flex items-center justify-center
               text-xl font-bold shadow-lg shadow-blue-200 shrink-0"
      >
        S
      </div>

      @if (sidebarOpen) {
        <span
          class="ml-3 text-2xl font-bold text-blue-600 whitespace-nowrap"
        >
          SEO Dashboard
        </span>
      }

    </div>


    <!-- ========================================= -->
    <!-- MENU -->
    <!-- ========================================= -->

    <nav class="flex-1 overflow-y-auto px-3 py-4">

      @for (item of menuItems; track item.title) {

        <a
          [routerLink]="item.url"
          routerLinkActive="bg-blue-50 text-blue-600"
          [routerLinkActiveOptions]="{ exact: item.url === '/admin' }"
          class="w-full h-14 mb-1.5 rounded-xl
                 flex items-center relative
                 transition-all duration-200
                 text-slate-600
                 hover:bg-blue-50 hover:text-blue-600
                 no-underline"
        >

          <!-- ICON -->

          <span
            class="w-12 flex justify-center
                   text-xl shrink-0"
          >
            {{ item.icon }}
          </span>


          <!-- TITLE -->

          @if (sidebarOpen) {

            <span
              class="text-[17px] font-medium whitespace-nowrap"
            >
              {{ item.title }}
            </span>

          }


          <!-- ACTIVE INDICATOR -->

          @if (sidebarOpen) {

            <span
              class="absolute right-3
                     w-2 h-8 rounded-full
                     bg-blue-600
                     opacity-0
                     group-[.active]:opacity-100"
            ></span>

          }

        </a>

      }

    </nav>


    <!-- ========================================= -->
    <!-- SIDEBAR USER -->
    <!-- ========================================= -->

    <div
      class="h-[90px] border-t border-slate-200
             flex items-center px-4 shrink-0"
    >

      <!-- Avatar -->

      <div
        class="w-12 h-12 rounded-full
               bg-blue-100 text-blue-600
               flex items-center justify-center
               font-semibold text-lg shrink-0"
      >
        A
      </div>


      @if (sidebarOpen) {

        <!-- User Information -->

        <div class="ml-3 flex flex-col">

          <span class="font-semibold text-slate-800">
            Admin
          </span>

          <span
            class="mt-1 w-fit px-2.5 py-0.5 rounded-full
                   bg-purple-100 text-purple-600
                   text-xs font-medium"
          >
            admin
          </span>

        </div>


        <!-- Logout -->

        <button
          type="button"
          (click)="logout()"
          class="ml-auto text-xl text-slate-400
                 hover:text-red-500 transition-colors"
        >
          ↪
        </button>

      }

    </div>

  </aside>



  <!-- ========================================= -->
  <!-- MAIN CONTENT -->
  <!-- ========================================= -->

  <main
    class="min-h-screen transition-all duration-300"
    [class.ml-[280px]]="sidebarOpen"
    [class.ml-[80px]]="!sidebarOpen"
  >

    <!-- ========================================= -->
    <!-- TOP HEADER -->
    <!-- ========================================= -->

    <header
      class="h-[95px] bg-white border-b border-slate-200
             shadow-sm flex items-center justify-between
             px-7 sticky top-0 z-40"
    >

      <!-- LEFT -->

      <div class="flex items-center gap-8">

        <button
          type="button"
          (click)="toggleSidebar()"
          class="text-2xl text-slate-500
                 hover:text-blue-600
                 transition-colors"
        >
          ☰
        </button>


        <span class="text-lg text-slate-500">
          {{ nowdate | date:'fullDate' }}
        </span>

      </div>


      <!-- RIGHT -->

      <div class="flex items-center gap-5">

        <span
          class="px-4 py-2 rounded-full
                 bg-purple-100 text-purple-700
                 text-sm font-medium"
        >
          admin
        </span>


        <button
          type="button"
          (click)="logout()"
          class="text-red-600 text-lg font-medium
                 hover:text-red-700"
        >
          Logout
        </button>

      </div>

    </header>



    <!-- ========================================= -->
    <!-- PAGE CONTENT -->
    <!-- ========================================= -->

    <section class="p-8">

      <router-outlet></router-outlet>

    </section>

  </main>

</div>
